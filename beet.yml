
## Beet configuration file for a minimal template project using stewbeet, bolt, and mecha.
# (You guessed it but, this is not the most minimal template)

# Path to a folder for beet to output. If not defined, no files will visibly output
output: "build"

# A list of importable plugin strings
require:
    - "stewbeet"
    - "bolt"

# Takes a nested pack config, see PackConfig() documentation
data_pack:
    name: "datapack"
    load: ["src"]
resource_pack:
    name: "resourcepack"
    load: ["src"]

pipeline:
    - "mecha"
    - "src.entry_pages"
    - "src.patch_json_indent"
    - "stewbeet.plugins.auto.headers.silent"
    # Zip and copy the datapack and resource pack to copy destinations
    - "stewbeet.plugins.archive.silent"
    - "stewbeet.plugins.copy_to_destination.silent"

meta:
    # StewBeet's equivalent to "beet link" but copy zips instead
    stewbeet:
        build_copy_destinations:
            datapack: ["D:/minecraft/latest/saves/Breakdown/datapacks"]
            resource_pack: ["D:/minecraft/latest/resourcepacks"]

